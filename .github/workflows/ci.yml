name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Worker types
        run: bun run gen
      - name: Check formatting
        run: bunx prettier --check .
      - name: Lint
        run: bunx eslint .
      - name: Type check
        run: bun run check --fail-on-warnings
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Build CLI
        run: bun run cli:build
